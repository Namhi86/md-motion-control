<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>MD Motion Control</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0f1113; color: #e8e8e8; font: 15px -apple-system, system-ui, sans-serif; }
      main { max-width: 460px; padding: 32px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      p { color: #b8bcc2; line-height: 1.5; margin: 0 0 12px; }
      #stats { color: #e8e8e8; font-weight: 600; }
      .row { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
      button { font: inherit; padding: 9px 18px; border-radius: 8px; border: 1px solid #3a3f45; background: #1b1e22; color: #e8e8e8; cursor: pointer; }
      button.main { background: #d1fe17; border-color: #d1fe17; color: #1a1c1e; font-weight: 600; }
      button:disabled { opacity: 0.6; cursor: default; }
      #note { min-height: 1.5em; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Không mở được giao diện MD Motion Control</h1>
      <p>App chưa tải được giao diện (mất mạng hoặc máy chủ đang lỗi). Các video đang tạo vẫn chạy tiếp trong app.</p>
      <p id="stats">Đang đếm việc…</p>
      <div class="row">
        <button id="retry" class="main" type="button">Thử lại</button>
        <button id="pause" type="button">Dừng hàng đợi</button>
      </div>
      <p id="note"></p>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
